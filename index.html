<!DOCTYPE html>
<html lang = "vi">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Web đăng ký học Tin học</title>
	<link href="styles.css" rel="stylesheet" type = "text/css">
</head>
<body>
	<h1 style="color:#1E3A8A">WEB ĐĂNG KÝ HỌC TIN HỌC</h1>
	<h2 style="color:#0284C7">Nhập thông tin cá nhân</h2>
	<form id="formDangKy">
		<table>
			<tr>
				<td><label for="hoten">Họ tên:<span style="color:red">*</span></label></td>
				<td><label for="ngaysinh">Ngày sinh:<span style="color:red">*</span></label></td>
				<td><label for="gioitinh">Giới tính:<span style="color:red">*</span></label></td>	
			</tr>
			<tr>
				<td><input id="hoten" type="text" name="hoten" placeholder="Nhập họ tên" maxlength="40" required style="width: 300px"></td>
				<td><input id="ngaysinh" type="date" name="ngaysinh"></td>
				<td>
					<input id="gioitinh" type="radio" value="Nam" name="gioitinh1" checked>Nam
					<input id="gioitinh" type="radio" value="Nu" name="gioitinh1">Nữ
				</td>				
			</tr>
			<tr>
				<td><label for="lop">Lớp:<span style="color:red">*</span></label></td>
				<td><label for="sodt">Số điện thoại:<span style="color:red">*</span></label></td>	
				<td></td>			
			</tr>
			<tr>
				<td><input id="lop" type="text" name="lop" placeholder="Nhập lớp học" required></td>
				<td><input id="sodt" type="text" name="sodt" placeholder="Số điện thoại đang sử dụng" required></td>
				<td></td>
			</tr>
			<tr>
				<td><label for="diachi">Địa chỉ:<span style="color:red">*</span></label></td>
				<td><label for="email">Địa chỉ email:<span style="color:red">*</span></label></td>
				<td></td>
			</tr>
			<tr>				
				<td><input id="diachi" type="text" name="diachi" placeholder="Nhập địa chỉ hiện tại" maxlength="40" required style="width: 300px"></td>
				<td><input id="email" type="email" name="email" placeholder="Nhập địa chỉ email" maxlength="40" required style="width: 300px"></td>
				<td></td>
			</tr>
			<tr height="20px"></tr>	
			<tr>
				<td>
					<label for="monhoc">Môn học bạn muốn tham gia:<span style="color:red">*</span></label>								
				<td style="text-align: left;">
					<select id="monhoc" name="monhoc">
						<option value="">-- Chọn môn học bạn quan tâm --</option>
						<option value="python">Lập trình Python</option>
						<option value="C++">Lập trình C++</option>
						<option value="HTML">HTML cơ bản</option>
						<option value="window form">Window Form C#</option>
					</select>
				</td>	
			</tr>	
			<tr height="20px"></tr>			
			<tr>
				<td colspan="3">
				<label for="nghenghiep"><strong>Lí do bạn muốn tham gia và định hướng nghề trong tương lai:</strong></label>
			</td></tr>
			<tr>
				<td colspan="3"><textarea id="nghenghiep" name="nghenghiep" rows="4" cols="66" 
				placeholder="Nhập lí do chọn vào ô này" required></textarea>
				</td>
			</tr>
		</table>	
	</form>
	<br>
	<table>
		<tr>
			<td><button onclick="dangky()">Đăng ký</button></td>
			<td></td><td></td> <!--Khoảng cách 2 nút lệnh -->
			<td><button onclick="xuat()">Xuất file excel</button></td>
		</tr>
	</table>	
	<h2 style="color:green">DANH SÁCH HỌC SINH ĐĂNG KÝ LỚP HỌC</h2>
	<table id="tbl" border="1" cellspacing="0" cellpadding="2">
		<!-- Dòng tiêu đề lớn phía trên bảng -->
		<tr>
			<td colspan="10" style="font-size: 18px; font-weight: bold; text-align: center; height: 40px; vertical-align: middle; background-color: #f3f4f6;">
				DANH SÁCH HỌC SINH THAM GIA HỌC
			</td>
		</tr>
		<tr>
			<th>STT</th>
			<th>Họ tên</th>
			<th>Ngày sinh</th>
			<th>Giới tính</th>
			<th>Lớp</th>
			<th>Số ĐT</th>
			<th>Địa chỉ Email</th>
			<th>Môn học tham gia</th>
			<th>Ghi chú</th>
			<th>Thao tác</th>
		</tr>
		<tbody id="body"></tbody>
	</table>
	<!--- Đổ dữ liệu vào bảng --->
	<script>
		// Dòng 1-3: Chạy hàm hienThiDanhSach() ngay khi trang web tải xong
		window.onload = function() {
			hienThiDanhSach();
		};

		// Dòng 6-9: Lấy dữ liệu dạng chuỗi JSON từ bộ nhớ localStorage và đổi lại thành mảng
		function layDanhSach() {
			var ds = localStorage.getItem("danhSachHocSinh"); // Lấy chuỗi theo khóa "danhSachHocSinh"
			return ds ? JSON.parse(ds) : [];                  // Nếu có dữ liệu thì giải mã JSON, ngược lại trả về mảng rỗng []
		}

		// Dòng 12-14: Chuyển mảng dữ liệu thành chuỗi JSON và lưu vào localStorage
		function luuDanhSach(danhSach) {
			localStorage.setItem("danhSachHocSinh", JSON.stringify(danhSach)); // Lưu mảng vào bộ nhớ
		}

		// Dòng 17-49: Xử lý sự kiện khi nhấn nút "Đăng ký"
		function dangky() {
			// Lấy giá trị từ các ô nhập dữ liệu trên form
			var ten = document.getElementById("hoten").value;
			var ngsinh = document.getElementById("ngaysinh").value;
			var gt = document.querySelector('input[name="gioitinh1"]:checked');
			var gtinh = gt ? gt.value : "";
			var lop = document.getElementById("lop").value;
			var sodt = document.getElementById("sodt").value;
			var email = document.getElementById("email").value;
			var monhoc = document.getElementById("monhoc").value;
			var ghichu = document.getElementById("nghenghiep").value;

			// Kiểm tra các trường bắt buộc đã được nhập hay chưa
			if (ten && ngsinh && gtinh && lop && sodt && email && monhoc) {
				// Đóng gói thông tin thành đối tượng JavaScript
				var hocSinhMoi = {
					ten: ten,
					ngsinh: ngsinh,
					gtinh: gtinh,
					lop: lop,
					sodt: sodt,
					email: email,
					monhoc: monhoc,
					ghichu: ghichu
				};

				var danhSach = layDanhSach(); // 1. Lấy danh sách đang lưu trong máy
				danhSach.push(hocSinhMoi);   // 2. Thêm học sinh mới vào danh sách
				luuDanhSach(danhSach);       // 3. Lưu danh sách mới đè lại vào bộ nhớ

				hienThiDanhSach();           // 4. Cập nhật lại giao diện bảng
				
				// 2. Xóa sạch các ô thông tin ở form trên để chuẩn bị nhập tiếp
				document.getElementById("formDangKy").reset();
			} else {
				alert("Vui lòng nhập đầy đủ thông tin!"); // Báo lỗi nếu nhập thiếu
			}
		}

		// Dòng 52-82: Lấy dữ liệu từ bộ nhớ và dựng các dòng <tr> lên bảng HTML
		function hienThiDanhSach() {
			var danhSach = layDanhSach();             // Lấy danh sách từ localStorage
			var tbody = document.getElementById("body");
			tbody.innerHTML = "";                     // Xóa các dòng cũ trên bảng để tránh bị trùng lặp

			// Lặp qua từng phần tử trong mảng danh sách
			danhSach.forEach(function(item, index) {
				var row = '<tr>' +
					'<td>' + (index + 1) + '</td>' +   // STT tự động dựa trên chỉ số index (+1)
					// [BỔ SUNG 2]: Thêm style="text-align: left;" để căn trái cột Họ tên
					'<td style="text-align: left;">' + item.ten + '</td>' +
					'<td>' + item.ngsinh + '</td>' +
					'<td>' + item.gtinh + '</td>' +
					'<td>' + item.lop + '</td>' +
					'<td>' + item.sodt + '</td>' +
					'<td>' + item.email + '</td>' +
					'<td>' + item.monhoc + '</td>' +
					'<td>' + item.ghichu + '</td>' +
					// Nút xóa gọi hàm xoaDong() kèm theo chỉ số vị trí index
					'<td style="text-align: center;">' +
						'<button type="button" onclick="xoaDong(' + index + ')" style="background-color: #fee2e2 !important; border: none; border-radius: 6px; padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;">' +
							'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
								'<polyline points="3 6 5 6 21 6"></polyline>' +
								'<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2 2v2"></path>' +
								'<line x1="10" y1="11" x2="10" y2="17"></line>' +
								'<line x1="14" y1="11" x2="14" y2="17"></line>' +
							'</svg>' +
						'</button>' +
					'</td>' +
				'</tr>';
				tbody.innerHTML += row; // Đưa dòng mới tạo vào trong tbody
			});
		}

		// Dòng 85-92: Xóa 1 học sinh theo chỉ số index trong mảng và lưu lại bộ nhớ
		function xoaDong(index) {
			if (confirm("Bạn có chắc chắn muốn xóa dòng này không?")) {
				var danhSach = layDanhSach(); // Lấy danh sách hiện tại
				danhSach.splice(index, 1);    // Loại bỏ 1 phần tử tại chỉ số index
				luuDanhSach(danhSach);        // Cập nhật mảng đã xóa vào localStorage
				hienThiDanhSach();            // Vẽ lại bảng mới
			}
		}

		// Dòng 95-113: Xuất danh sách bảng ra file Excel (.xls)
		function xuat() {
			var tblClone = document.getElementById("tbl").cloneNode(true); // Nhân bản bảng HTML
			var titleTd = tblClone.querySelector("td[colspan]");
			if (titleTd) {
				titleTd.setAttribute("colspan", "9"); // Căn lại tiêu đề ô lớn
			}

			var rows = tblClone.querySelectorAll("tr");
			rows.forEach(function(row) {
				if (!row.querySelector("td[colspan]") && row.cells.length > 0) {
					row.deleteCell(-1); // Xóa cột "Thao tác" (cột nút xóa) trước khi xuất file
				}
			});

			var html = '<meta charset="utf-8">' + tblClone.outerHTML;
			var a = document.createElement("a");
			a.href = 'data:application/vnd.ms-excel;charset=utf-8,\ufeff' + encodeURIComponent(html);
			a.download = 'Danh_Sach_Hoc_Sinh.xls'; // Đặt tên file tải về
			a.click();
		}
	</script>
		
</body>
</html>
